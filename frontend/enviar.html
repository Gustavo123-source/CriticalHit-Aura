<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Hit</title>

    <link rel="preload" href="style.css" as="style">
    <link rel="preload" href="fotos/Sem nome (1920 x 540 px).png" as="image">
    
    <script>
        if (localStorage.getItem("tema") === "escuro") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header> <!--header-->

        <div class="informações">
            <div id="logo"> <!--div-->
                <a href="inicio.html">
                    <img src="fotos/Sem nome (1920 x 540 px).png" width="265px" id="logo">
                </a>
            </div>
            <div>
                <a href="inicio.html" class="aDoNav">Explorar</a>
                <a href="inicio.html">
                    <img src="fotos/explorar.png" alt="Explorar" class="explorar">
                </a>
                
            </div>
            <div>
                <a href="enviar.html" class="aDoNav">Enviar</a>
                <a href="enviar.html">
                    <img src="fotos/enviar.png" alt="Enviar" class="explorar">
                </a>
                
            </div>
            <div>
                <a href="contatos.html" class="aDoNav">Nos contate</a>
                <a href="contatos.html">
                    <img src="fotos/contato.png" alt="Enviar" class="explorar">
                </a>
            </div>
            <div>
                <input type="text" id="pesquisar" placeholder="Pesquisar...">
            </div>
            <div id="perfilHeader">
                <a href="perfil.html">
                    <img src="fotos/perfil sem imagem.jpg" alt="foto" style="border-radius:5px; max-width: 100px; max-height: 60px;" id="PerfilPlayer">
                </a>
                <div id="nomeHeader" style="margin-left: 5px;"></div>
            </div>
            <div  style="margin-right:2%">
                <a href="Settings.html">
                    <img src="fotos/config.png" alt="configurações" width="65px" id="configHeader">
                </a>
            </div>
        </div>
        
    </header>
    
    
    
    <section id="secDoForm">
        <div id="headerDoForm">
            <h1>- Preencha as informações abaixo. </h1>
        </div>
        <form onsubmit="JogoPost(event)"   id="formEnviar">
            <div id="part1JG">
                <div class="formJG">
                    <label for="titulo" class="labelJG">Nome do seu jogo:</label>
                    <input type="text" id="titulo" class="inputJG">
                </div>
                <br><br>
                <div class="formJG">
                    <label for="genero" class="labelJG">Diga a descrição do seu jogo:</label>
                    <textarea rows="10" id="genero" class="inputJG"></textarea>
                </div>
                <br><br>
                <div class="formJG">
                    <label for="genero" class="labelJG">Informe a url do seu jogo:</label>
                    <input type="url" id="urljogo" class="inputJG">
                </div>
            </div>
            <div id="part2JG">
                <div class="formJG">
                <label for="capaArquivo" class="labelJG">Coloque a capa do seu jogo:</label>
                <input style="display: none;" type="file" id="capaArquivo" accept="image/*">
                <label for="capaArquivo" class="btnArquivo">
                    Escolher capa
                </label>
                <img id="previewCapa" src="" alt="" class="fileJG" style="display:none; margin-top:10px; border-radius:6px;">
                <p id="statusUpload" style="display:none; color:gray;">Enviando imagem, aguarde...</p>
            </div>
            </div>
            <br><br>
    
                <button type="submit" id="idPublicar">
                    <img src="fotos/check.png" alt="Enviar" width="80px">
                </button>
            
            <br><br>
        </form>
    </section>

    
    <script src="Cloudinary_upload.js"></script>
    <script src="script.js"></script>
</body>
</html>
